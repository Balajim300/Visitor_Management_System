<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitor Registration | VisitorPro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .register-page {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .register-card {
            background: #1e293b;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            margin-bottom: 8px;
            font-size: 32px;
        }

        .register-header p {
            color: #94a3b8;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #6366f1;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input[type="file"] {
            padding: 10px;
        }

        .required {
            color: #f87171;
        }

        .submit-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #a5b4fc;
        }

        .flash {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .flash-success {
            background: rgba(34,197,94,0.15);
            color: #4ade80;
        }

        .flash-error {
            background: rgba(239,68,68,0.15);
            color: #f87171;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .register-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="register-page">

    <a href="{{ url_for('home') }}" class="back-btn">
        ← Back to Home
    </a>

    <div class="register-card">

        <div class="register-header">
            <h1>📝 Visitor Registration</h1>
            <p>Enter visitor information to register a new visit</p>
        </div>


        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash
                        {% if category == 'success' %}
                            flash-success
                        {% else %}
                            flash-error
                        {% endif %}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Registration Form -->
        <form method="POST"
              enctype="multipart/form-data">

            <div class="form-grid">

                <!-- Name -->
                <div class="form-group">
                    <label>
                        Full Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter visitor name"
                        required>
                </div>


                <!-- Mobile -->
                <div class="form-group">
                    <label>
                        Mobile Number <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        name="mobile"
                        placeholder="Enter mobile number"
                        required>
                </div>


                <!-- Email -->
                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter email address">
                </div>


                <!-- ID Proof -->
                <div class="form-group">
                    <label>ID Proof</label>

                    <input
                        type="text"
                        name="id_proof"
                        placeholder="Aadhar / PAN / Driving License">
                </div>


                <!-- Employee -->
                <div class="form-group">

                    <label>
                        Whom to Meet <span class="required">*</span>
                    </label>

                    <select name="employee_id" required>

                        <option value="">
                            -- Select Employee --
                        </option>

                        {% for employee in employees %}

                            <option value="{{ employee.id }}">
                                {{ employee.name }}
                                {% if employee.department %}
                                    - {{ employee.department }}
                                {% endif %}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Purpose -->
                <div class="form-group">

                    <label>
                        Purpose of Visit <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="purpose"
                        placeholder="Interview / Meeting / Personal"
                        required>

                </div>


                <!-- Address -->
                <div class="form-group full">

                    <label>Address</label>

                    <textarea
                        name="address"
                        placeholder="Enter visitor address"></textarea>

                </div>


                <!-- Photo -->
                <div class="form-group full">

                    <label>Visitor Photo</label>

                    <input
                        type="file"
                        name="photo"
                        accept="image/*">

                </div>

            </div>


            <button type="submit" class="submit-btn">
                Register Visitor
            </button>

        </form>

    </div>

</div>

</body>
</html>
