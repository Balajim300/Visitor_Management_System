<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | VisitorPro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .login-page {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .login-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            background: linear-gradient(135deg, #6c63ff, #00c6ff);
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #b8bfd0;
            margin-bottom: 30px;
        }

        .login-card label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-card input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.2);
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        .login-card input:focus {
            border-color: #6c63ff;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #6c63ff, #00c6ff);
        }

        .login-btn:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #b8bfd0;
            text-decoration: none;
        }

        .back-home:hover {
            color: white;
        }

        .flash-error {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            background: rgba(255, 70, 70, 0.15);
            color: #ff8d8d;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-icon">
            🔐
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Login to manage VisitorPro
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-error">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter admin username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit" class="login-btn">
                Login to Dashboard
            </button>

        </form>

        <a href="{{ url_for('home') }}" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
