<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitor Login | VisitorPro</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 380px;
            background: #1e293b;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-bottom: 20px;

            border: 1px solid #475569;
            border-radius: 10px;

            background: #0f172a;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: #6366f1;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        .message {
            background: #7f1d1d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>👤 Visitor Login</h1>

    <p class="subtitle">
        Login to view your information
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form method="POST">

        <label>
            Visitor ID
        </label>

        <input
            type="text"
            name="visitor_id"
            placeholder="Example: VIS-ABC123"
            required
        >

        <label>
            Mobile Number
        </label>

        <input
            type="text"
            name="mobile"
            placeholder="Enter mobile number"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a href="/" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
